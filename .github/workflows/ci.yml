name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & self-tests (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh

      - name: Build & self-tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
